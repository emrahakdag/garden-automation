[supervisord]
nodaemon=true
logfile=/dev/null
loglevel=info

[program:php-fpm]
command=php-fpm -F -y /usr/local/etc/php-fpm.d/zz-docker.conf
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
